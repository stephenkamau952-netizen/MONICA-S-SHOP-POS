<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="calculator" aria-label="Calculator">
      <output class="display" id="display" aria-live="polite">0</output>

      <div class="buttons">
        <button class="button utility" type="button" data-action="clear">AC</button>
        <button class="button utility" type="button" data-action="sign">+/−</button>
        <button class="button utility" type="button" data-action="percent">%</button>
        <button class="button operator" type="button" data-operator="/">÷</button>

        <button class="button number" type="button" data-value="7">7</button>
        <button class="button number" type="button" data-value="8">8</button>
        <button class="button number" type="button" data-value="9">9</button>
        <button class="button operator" type="button" data-operator="*">×</button>

        <button class="button number" type="button" data-value="4">4</button>
        <button class="button number" type="button" data-value="5">5</button>
        <button class="button number" type="button" data-value="6">6</button>
        <button class="button operator" type="button" data-operator="-">−</button>

        <button class="button number" type="button" data-value="1">1</button>
        <button class="button number" type="button" data-value="2">2</button>
        <button class="button number" type="button" data-value="3">3</button>
        <button class="button operator" type="button" data-operator="+">+</button>

        <button class="button number zero" type="button" data-value="0">0</button>
        <button class="button decimal" type="button" data-action="decimal">.</button>
        <button class="button equal" type="button" data-action="equals">=</button>
      </div>
    </main>

    <script src="calculator.js"></script>
    <script src="app.js"></script>
  </body>
</html>
